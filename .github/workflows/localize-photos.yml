name: Photos locales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.html']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/localize_photos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A assets/photos *.html
          git diff --cached --quiet || (git commit -m "Photos servies localement [auto]" && git push)
